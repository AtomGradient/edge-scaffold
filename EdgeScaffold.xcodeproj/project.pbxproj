			shellScript = "#!/bin/bash\nset +e\n\nINFO_PLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"\nif [ ! -f \"${INFO_PLIST}\" ]; then\n    echo \"Edge build stamp skipped: Info.plist not found\"\n    exit 0\nfi\n\nGIT_COMMIT=\"unknown\"\nGIT_DIRTY=\"unknown\"\nif command -v git >/dev/null 2>&1; then\n    GIT_ROOT=\"$(git -C \"${SRCROOT}\" rev-parse --show-toplevel 2>/dev/null || true)\"\n    if [ -n \"${GIT_ROOT}\" ]; then\n        CANDIDATE_COMMIT=\"$(git -C \"${GIT_ROOT}\" rev-parse HEAD 2>/dev/null || true)\"\n        if [ -n \"${CANDIDATE_COMMIT}\" ]; then\n            GIT_COMMIT=\"${CANDIDATE_COMMIT}\"\n        fi\n        if [ -n \"$(git -C \"${GIT_ROOT}\" status --porcelain 2>/dev/null)\" ]; then\n            GIT_DIRTY=\"true\"\n        else\n            GIT_DIRTY=\"false\"\n        fi\n    fi\nfi\n\n/usr/libexec/PlistBuddy -c \"Set :EdgeBuildCommit ${GIT_COMMIT}\" \"${INFO_PLIST}\" 2>/dev/null \\\n    || /usr/libexec/PlistBuddy -c \"Add :EdgeBuildCommit string ${GIT_COMMIT}\" \"${INFO_PLIST}\" 2>/dev/null \\\n    || true\n/usr/libexec/PlistBuddy -c \"Set :EdgeBuildDirty ${GIT_DIRTY}\" \"${INFO_PLIST}\" 2>/dev/null \\\n    || /usr/libexec/PlistBuddy -c \"Add :EdgeBuildDirty string ${GIT_DIRTY}\" \"${INFO_PLIST}\" 2>/dev/null \\\n    || true\n\necho \"Edge build stamp embedded: commit=${GIT_COMMIT} dirty=${GIT_DIRTY}\"\n";
		};
