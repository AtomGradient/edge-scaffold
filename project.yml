name: EdgeScaffold
options:
  bundleIdPrefix: com.atomgradient
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  EdgeKit:
    url: https://github.com/AtomGradient/edge-kit.git
    exactVersion: 1.0.0-rc98
  EdgeHalo:
    url: https://github.com/AtomGradient/edge-halo-binary
    exactVersion: 1.0.0-rc24
  swift-async-algorithms:
    url: https://github.com/apple/swift-async-algorithms.git
    from: 1.1.3
  swift-markdown-ui:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1

targets:
  EdgeScaffold:
    type: application
    platform: iOS
    sources:
      - path: EdgeScaffold
        excludes:
          - "**/*.xcuserdata"
          - "**/build/**"
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/RPP
        buildPhase: resources
      - path: Resources/SampleData
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atomgradient.edgescaffolding
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: LURMZC2XJB
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: EdgeScaffold/Info.plist
        CODE_SIGN_ENTITLEMENTS: EdgeScaffold/EdgeScaffold.entitlements
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_CFBundleDisplayName: EdgeScaffold
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UIStatusBarStyle: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    postBuildScripts:
      - name: Embed Build Stamp
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          #!/bin/bash
          set +e

          INFO_PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "${INFO_PLIST}" ]; then
              echo "Edge build stamp skipped: Info.plist not found"
              exit 0
          fi

          GIT_COMMIT="unknown"
          GIT_DIRTY="unknown"
          if command -v git >/dev/null 2>&1; then
              GIT_ROOT="$(git -C "${SRCROOT}" rev-parse --show-toplevel 2>/dev/null || true)"
              if [ -n "${GIT_ROOT}" ]; then
                  CANDIDATE_COMMIT="$(git -C "${GIT_ROOT}" rev-parse HEAD 2>/dev/null || true)"
                  if [ -n "${CANDIDATE_COMMIT}" ]; then
                      GIT_COMMIT="${CANDIDATE_COMMIT}"
                  fi
                  if [ -n "$(git -C "${GIT_ROOT}" status --porcelain 2>/dev/null)" ]; then
                      GIT_DIRTY="true"
                  else
                      GIT_DIRTY="false"
                  fi
              fi
          fi

          /usr/libexec/PlistBuddy -c "Set :EdgeBuildCommit ${GIT_COMMIT}" "${INFO_PLIST}" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :EdgeBuildCommit string ${GIT_COMMIT}" "${INFO_PLIST}" 2>/dev/null \
              || true
          /usr/libexec/PlistBuddy -c "Set :EdgeBuildDirty ${GIT_DIRTY}" "${INFO_PLIST}" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :EdgeBuildDirty string ${GIT_DIRTY}" "${INFO_PLIST}" 2>/dev/null \
              || true

          echo "Edge build stamp embedded: commit=${GIT_COMMIT} dirty=${GIT_DIRTY}"
      - script: |
          #!/bin/bash

          if [ "$SKIP_MODEL_COPY" = "1" ]; then
              echo "⏭️  Skipping model copy (SKIP_MODEL_COPY=1)"
              exit 0
          fi

          CONFIG_FILE="${SRCROOT}/edgescaffolding_model_config"
          if [ -f "${CONFIG_FILE}" ]; then
              source "${CONFIG_FILE}"
          fi

          MODEL_COPY="${MODEL_COPY:-false}"
          MODEL_NAME="${MODEL_NAME:-}"
          MODELS_SOURCE_DIR="${MODELS_SOURCE_DIR:-}"

          if [ "${MODEL_COPY}" = "0" ] || [ "${MODEL_COPY}" = "false" ]; then
              echo "⏭️  Skipping model copy (MODEL_COPY != true)"
              exit 0
          fi

          if [ -z "${MODEL_NAME}" ] || [ -z "${MODELS_SOURCE_DIR}" ]; then
              echo "⚠️  No model configured in ${CONFIG_FILE}"
              exit 0
          fi

          MODEL_SRC="${MODELS_SOURCE_DIR}/${MODEL_NAME}"
          if [ ! -d "${MODEL_SRC}" ]; then
              echo "❌ Model not found: ${MODEL_SRC}"
              echo "   Available models in ${MODELS_SOURCE_DIR}:"
              ls -1 "${MODELS_SOURCE_DIR}" 2>/dev/null || echo "   (directory not accessible)"
              exit 1
          fi

          DEST="${BUILT_PRODUCTS_DIR}/${EXECUTABLE_FOLDER_PATH}/${MODEL_NAME}"
          if [ -d "${DEST}" ]; then
              SRC_SIZE=$(du -s "${MODEL_SRC}" | cut -f1)
              DST_SIZE=$(du -s "${DEST}" | cut -f1)
              if [ "${SRC_SIZE}" = "${DST_SIZE}" ]; then
                  echo "✅ Model already in bundle (unchanged)"
                  exit 0
              fi
          fi

          echo "📦 Copying model: ${MODEL_NAME}"
          echo "   From: ${MODEL_SRC}"
          echo "   To:   ${DEST}"

          rm -rf "${DEST}"
          cp -r "${MODEL_SRC}" "${DEST}"

          if [ $? -eq 0 ]; then
              MODEL_SIZE=$(du -sh "${DEST}" | cut -f1)
              echo "✅ Model copied (${MODEL_SIZE})"
          else
              echo "❌ Failed to copy model"
              exit 1
          fi
        name: Copy Local Model
        basedOnDependencyAnalysis: false
    dependencies:
      - package: EdgeKit
        product: EdgeInference
      - package: EdgeKit
        product: EdgeVoice
      - package: EdgeKit
        product: EdgeModelKit
      - package: EdgeKit
        product: EdgeMesh
      - package: EdgeKit
        product: EdgeData
      - package: EdgeKit
        product: EdgeDataMeshBridge
      - package: EdgeKit
        product: EdgeUI
      - package: EdgeKit
        product: EdgeSession
      - package: EdgeHalo
        product: EdgeHalo
      - package: swift-async-algorithms
        product: AsyncAlgorithms
      - package: swift-markdown-ui
        product: MarkdownUI
    entitlements:
      path: EdgeScaffold/EdgeScaffold.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
